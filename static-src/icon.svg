<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Icon Symbol Glow/Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Icon Base (Squircle / iOS-style Rounded Rectangle) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" />

  <!-- Generic Abstract App Symbol (Layers/Launchpad Concept) -->
  <g filter="url(#dropShadow)" fill="#FFFFFF">
    <!-- Top Central Element -->
    <path d="M256,120 L370,185 L256,250 L142,185 Z" opacity="0.95" />

    <!-- Middle Layer -->
    <path d="M142,225 L256,290 L370,225 L370,245 L256,310 L142,245 Z" opacity="0.8" />

    <!-- Bottom Layer -->
    <path d="M142,285 L256,350 L370,285 L370,305 L256,370 L142,305 Z" opacity="0.6" />
  </g>
</svg>
